{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" style="border-bottom: 1px solid #30363d;">
        <div class="container-fluid px-4">
            <div class="d-flex text-white me-5 fs-5 align-items-center">
                <a href="/" class="user-select-none text-decoration-none text-white">
                    <img src="{% static '/favicon4.ico' %}" width="40" height="40" class="mx-2">
                    Redline
                </a>
            </div>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <div class="navbar-nav mx-auto">
                    <form class="ms-5 d-flex"><a class="btn btn-primary me-2 border border-info border-3 fw-bold"
                            href="/post">Add Post</a></form>
                    <form class="d-flex" method="GET" action="/search/">
                        <input name="q" class="form-control me-2 bg-dark text-white border-secondary" type="search"
                            placeholder="Search...">
                        <button class="btn btn-outline-light border border-3" type="submit">Search</button>
                    </form>
                </div>
                <div class="dropdown d-flex align-items-center">
                    <ul class="navbar-nav mb-lg-0 me-3">
                        <li class="nav-item mx-1"><a
                                class="nav-link {% if request.resolver_match.url_name == 'index' %}active-feed{% endif %}"
                                href="{% url 'index' %}">Global</a></li>
                        <li class="nav-item mx-1"><a
                                class="nav-link {% if request.resolver_match.url_name == 'feed' %}active-feed{% endif %}"
                                href="{% url 'feed' %}">Following</a></li>
                    </ul>
                    <a href id="imageDropdown" data-bs-toggle="dropdown" class="ms-1 me-2">
                        <img src="{{ user_profile.profile_image.url }}" height="40" width="40"
                            class="rounded-circle border border-primary" style="object-fit: cover;">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end mt-2 dropdown-menu-dark">
                        <li><a class="dropdown-item" href="/profile/{{request.user.username}}">My Profile</a></li>
                        <li><a class="dropdown-item fw-bold text-info" href="/settings">Settings</a></li>
                        <li>
                            <hr class="dropdown-divider border-secondary">
                        </li>
                        <li><a class="dropdown-item text-danger" href="/logout">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
