{% extends 'base.html' %}

{% block content %}
<style>
    body {
        overflow-y: hidden;
    }
    
    .form-container {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }

    .map-box {
        border-radius: 20px;
        overflow: hidden;
        border: 1px solid #30363d;
        box-shadow: 0 0 20px rgba(13, 110, 253, 0.2);
    }

    .custom-input {
        background-color: #0d1117 !important;
        border: 1px solid #30363d !important;
        color: #e6edf3 !important;
        border-radius: 10px !important;
        padding: 12px 15px !important;
        transition: all 0.3s ease;
    }

    .custom-input:focus {
        border-color: #0d6efd !important;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15) !important;
        transform: translateY(-1px);
    }

    .btn-redline-primary {
        background: linear-gradient(45deg, #0d6efd, #0b5ed7);
        border: none;
        color: white;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        padding: 15px 30px;
        border-radius: 12px;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(13, 110, 253, 0.3);
    }

    .btn-redline-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(13, 110, 253, 0.5);
        background: linear-gradient(45deg, #0b5ed7, #0d6efd);
        color: white;
    }

    .btn-redline-outline {
        background: transparent;
        border: 2px solid #30363d;
        color: #8b949e;
        font-weight: 600;
        padding: 12px 20px;
        border-radius: 12px;
        transition: all 0.3s ease;
    }

    .btn-redline-outline:hover {
        border-color: #f85149;
        color: #f85149;
        background: rgba(248, 81, 73, 0.05);
    }

    .form-label {
        font-size: 0.8rem;
        font-weight: 700;
        color: #8b949e;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }

    .read-only-box {
        background-color: #21262d !important;
        color: #58a6ff !important;
        font-family: 'Courier New', Courier, monospace;
    }
</style>

<div class="row g-5 mb-5">
    <div class="col-lg-7">
        <div class="d-flex align-items-center mb-4">
            <div class="bg-primary bg-opacity-10 p-3 rounded-circle me-3">
                <i class="bi bi-pencil-square text-primary fs-3"></i>
            </div>
            <div>
                <h2 class="fw-bold m-0 text-white">Edit Location</h2>
                <p class="text-muted m-0">Click on the map to move the pin</p>
            </div>
        </div>
        <div class="map-box" id="map" style="height: 550px; width: 100%;"></div>
    </div>

    <div class="col-lg-5">
        <div class="form-container">
            <h3 class="fw-bold mb-4 text-white">Update Pin Data</h3>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Brand / Make</label>
                        <input type="text" name="make" class="form-control custom-input" value="{{ post_object.make }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Model</label>
                        <input type="text" name="model" class="form-control custom-input" value="{{ post_object.model }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="caption" class="form-control custom-input" rows="2">{{ post_object.caption }}</textarea>
                </div>

                <div class="row mb-4">
                    <div class="col-6">
                        <label class="form-label">Lat</label>
                        <input type="text" name="latitude" class="form-control custom-input read-only-box" value="{{ post_object.latitude }}" readonly>
                    </div>
                    <div class="col-6">
                        <label class="form-label">Long</label>
                        <input type="text" name="longitude" class="form-control custom-input read-only-box" value="{{ post_object.longitude }}" readonly>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Update photo <span class="text-muted" style="text-transform: none; font-weight: normal;">(Leave empty to keep current)</span></label>
                    <div class="input-group">
                        <input type="file" name="image" class="form-control custom-input" id="formFile">
                    </div>
                </div>

                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-redline-primary">
                        <i class="bi bi-check-circle-fill me-2"></i> Save Changes
                    </button>
                    <a href="/" class="btn btn-redline-outline text-center btn-sm">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    var map = L.map('map', {
        zoomControl: false 
    }).setView([{{ post_object.latitude|safe }}, {{ post_object.longitude|safe }}], 13);
    
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CartoDB'
    }).addTo(map);

    var currentMarker = L.marker([{{ post_object.latitude|safe }}, {{ post_object.longitude|safe }}]).addTo(map);

    var latInput = document.getElementsByName('latitude')[0];
    var lngInput = document.getElementsByName('longitude')[0];

    map.on('click', (event) => {
        const { lat, lng } = event.latlng;
        if (currentMarker) {
            currentMarker.setLatLng([lat, lng]);
        } else {
            currentMarker = L.marker([lat, lng]).addTo(map);
        }
        latInput.value = lat.toFixed(8);
        lngInput.value = lng.toFixed(8);
    });
</script>
{% endblock %}
